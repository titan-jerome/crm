{% extends "base.html" %}
{% block title %}{{ title }} · Deal CRM{% endblock %}

{% block content %}
  <div class="form-head">
    <a class="back-link" href="{{ url_for('index') }}">← Back to deals</a>
    <h1>{{ title }}</h1>
  </div>

  <div class="card form-card">
    <form class="form" method="post" action="{{ action }}" novalidate>
      <div class="field">
        <label class="field__label" for="company_name">Company name <span class="req" aria-hidden="true">*</span></label>
        <input class="input" id="company_name" name="company_name" type="text" required
               value="{{ deal.company_name }}" placeholder="Acme Corp." autocomplete="off" autofocus>
      </div>

      <div class="field">
        <label class="field__label" for="ebitda">Estimated EBITDA</label>
        <div class="input-money">
          <span class="input-money__prefix" aria-hidden="true">$</span>
          <input class="input" id="ebitda" name="ebitda" type="text" inputmode="numeric"
                 placeholder="2500000" value="{{ deal.ebitda }}" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="valuation">Estimated valuation</label>
        <div class="input-money">
          <span class="input-money__prefix" aria-hidden="true">$</span>
          <input class="input" id="valuation" name="valuation" type="text" inputmode="numeric"
                 placeholder="12000000" value="{{ deal.valuation }}" autocomplete="off">
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="drive_link">Google Drive folder link</label>
        <input class="input" id="drive_link" name="drive_link" type="url"
               placeholder="https://drive.google.com/..." value="{{ deal.drive_link }}" autocomplete="off">
      </div>

      <div class="field">
        <label class="field__label" for="notes">Notes</label>
        <textarea class="textarea" id="notes" name="notes"
                  placeholder="Deal context, diligence findings, next steps…">{{ deal.notes }}</textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn--primary" type="submit">Save deal</button>
        <a class="btn btn--ghost" href="{{ url_for('index') }}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
